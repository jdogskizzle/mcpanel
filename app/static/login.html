<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Minecraft Servers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2359a14f'/><rect x='3' y='4' width='3' height='3' fill='%23233'/><rect x='10' y='4' width='3' height='3' fill='%23233'/><rect x='6' y='8' width='4' height='5' fill='%23233'/></svg>">
<style>
:root {
  --bg: #f4f5f2; --card: #ffffff; --text: #1d211c; --muted: #646b62; --line: #dfe2dc;
  --accent: #3f7d36; --accent-text: #fff; --danger: #b3261e;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141613; --card: #1d201c; --text: #e7eae4; --muted: #9aa196; --line: #30352e;
    --accent: #6fbf62; --accent-text: #0f140e; --danger: #f2827a; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: min(340px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 20px; margin: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
input { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
button { font: inherit; font-weight: 600; padding: 9px 12px; border-radius: 8px; cursor: pointer;
  background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); }
.err { color: var(--danger); font-size: 13px; margin: 0; }
.err:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1>Minecraft servers</h1>
  <p class="err" role="alert">{{error}}</p>
  <label>Username<input name="username" value="{{user}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
